version: '3.9'

name: article-summarizer

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ─── PostgreSQL ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: summarizer-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-summarizer}
      POSTGRES_USER: ${POSTGRES_USER:-summarizer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-summarizer} -d ${POSTGRES_DB:-summarizer}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - summarizer-net
    ports:
      - "127.0.0.1:5432:5432"  # فقط localhost
    deploy:
      resources:
        limits:
          memory: 1G

  # ─── Redis ──────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: summarizer-redis
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - summarizer-net
    ports:
      - "127.0.0.1:6379:6379"  # فقط localhost
    deploy:
      resources:
        limits:
          memory: 512M

  # ─── Elasticsearch ──────────────────────────────────────────────
  elasticsearch:
    image: elasticsearch:8.12.0
    container_name: summarizer-elasticsearch
    restart: unless-stopped
    logging: *default-logging
    environment:
      - cluster.name=summarizer-cluster
      - node.name=summarizer-node
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - ingest.geoip.downloader.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 | grep -q 'cluster_name'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - summarizer-net
    ports:
      - "127.0.0.1:9200:9200"
    deploy:
      resources:
        limits:
          memory: 2G

  # ─── FastAPI Backend ────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: production
    container_name: summarizer-api
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - SECRET_KEY=${SECRET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://example.com}
      - ENVIRONMENT=production
      - LOG_LEVEL=info
    env_file:
      - .env
    volumes:
      - api_static:/app/static
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - summarizer-net
    deploy:
      resources:
        limits:
          memory: 1G
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.example.com`)"

  # ─── Celery Worker ──────────────────────────────────────────────
  celery:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: production
    container_name: summarizer-celery
    restart: unless-stopped
    logging: *default-logging
    command: celery -A app.tasks worker -l info -c 4
    depends_on:
      - api
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - SECRET_KEY=${SECRET_KEY}
    env_file:
      - .env
    volumes:
      - api_static:/app/static
    networks:
      - summarizer-net
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"

  # ─── Celery Beat (Scheduler) ────────────────────────────────────
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: production
    container_name: summarizer-celery-beat
    restart: unless-stopped
    logging: *default-logging
    command: celery -A app.tasks beat -l info --schedule /tmp/celerybeat-schedule
    depends_on:
      - api
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    env_file:
      - .env
    networks:
      - summarizer-net

  # ─── Next.js Frontend ───────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.next
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.example.com}
    container_name: summarizer-frontend
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - api
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.example.com}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', r => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - summarizer-net
    ports:
      - "127.0.0.1:3000:3000"
    deploy:
      resources:
        limits:
          memory: 512M

  # ─── Nginx Reverse Proxy ────────────────────────────────────────
  nginx:
    image: nginx:1.26-alpine
    container_name: summarizer-nginx
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - api
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_data:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    networks:
      - summarizer-net
    deploy:
      resources:
        limits:
          memory: 128M

  # ─── Certbot (SSL Auto-Renew) ───────────────────────────────────
  certbot:
    image: certbot/certbot:v2.9.0
    container_name: summarizer-certbot
    restart: unless-stopped
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_data:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - summarizer-net

volumes:
  postgres_data:
    driver: local
    name: summarizer-postgres-data
  redis_data:
    driver: local
    name: summarizer-redis-data
  elasticsearch_data:
    driver: local
    name: summarizer-elasticsearch-data
  api_static:
    driver: local
    name: summarizer-api-static
  certbot_data:
    driver: local
    name: summarizer-certbot-data
  certbot_certs:
    driver: local
    name: summarizer-certbot-certs

networks:
  summarizer-net:
    driver: bridge
    name: summarizer-net
    ipam:
      config:
        - subnet: 172.20.0.0/16