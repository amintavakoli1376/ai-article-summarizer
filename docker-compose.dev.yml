name: article-summarizer-dev

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "5m"
    max-file: "2"

services:

  postgres:
    image: postgres:16-alpine
    container_name: summarizer-dev-postgres
    logging: *default-logging
    environment:
      POSTGRES_DB: summarizer_dev
      POSTGRES_USER: summarizer
      POSTGRES_PASSWORD: dev_password_123
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U summarizer -d summarizer_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - summarizer-dev-net

  redis:
    image: redis:7-alpine
    container_name: summarizer-dev-redis
    logging: *default-logging
    command: redis-server --appendonly yes
    volumes:
      - redis_dev_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - summarizer-dev-net

  elasticsearch:
    image: elasticsearch:8.12.0
    container_name: summarizer-dev-elasticsearch
    logging: *default-logging
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    volumes:
      - elasticsearch_dev_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 | grep -q 'cluster_name'"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - summarizer-dev-net

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: development
    container_name: summarizer-dev-api
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src:ro
      - ./alembic:/app/alembic:ro
    environment:
      - DATABASE_URL=postgresql+asyncpg://summarizer:dev_password_123@postgres:5432/summarizer_dev
      - REDIS_URL=redis://redis:6379/0
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - SECRET_KEY=dev-secret-key-change-in-production
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - ENVIRONMENT=development
      - LOG_LEVEL=debug
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - summarizer-dev-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.next
      target: development
    container_name: summarizer-dev-frontend
    logging: *default-logging
    depends_on:
      - api
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    command: npm run dev
    networks:
      - summarizer-dev-net

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local
  elasticsearch_dev_data:
    driver: local

networks:
  summarizer-dev-net:
    driver: bridge
    name: summarizer-dev-net